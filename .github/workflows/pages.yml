# Deploy static web content to GitHub Pages.
# It chooses a deployable folder first, so the Pages artifact is either:
# - the repository root itself (current project), or
# - a built folder if the project later produces dist/build.
name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Determine deploy path
        id: path
        run: |
          if [ -d "dist" ]; then
            echo "deploy_path=dist" >> "$GITHUB_OUTPUT"
          elif [ -d "build" ]; then
            echo "deploy_path=build" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_path=." >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.path.outputs.deploy_path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
